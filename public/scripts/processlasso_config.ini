; ============================================================
; FMX Optimisation - Configuration Process Lasso Pro
; ============================================================
; Priorite processus: Elevee (High)
; Priorite E/S: Haute (High)
; Exclusion ProBalance pour processus gaming
; Lancement automatique
; ============================================================

[ProcessLasso]
; Demarrage automatique avec Windows
AutoStart=1

; Gerer tous les processus (pas seulement utilisateur)
ManageAllProcesses=1

; Priorite par defaut pour nouveaux processus
DefaultPriorityClass=High

; Priorite E/S par defaut
DefaultIoPriority=High

; Exclure processus gaming de ProBalance
ProBalanceExclude=1

; Liste processus exclus (separes par point-virgule)
; ADAPTER SELON VOS JEUX
ProBalanceExcludeList=FortniteClient-Win64-Shipping.exe;VALORANT.exe;cs2.exe;r5apex.exe;ModernWarfare.exe;Warzone.exe;Apex Legends.exe;Overwatch.exe;League of Legends.exe;RocketLeague.exe;RainbowSix.exe;Valorant-Win64-Shipping.exe

; Maintenir processus en vie (restart si crash)
KeepProcessesRunning=1
RestartIfTerminated=1

; SmartTrim - liberation memoire intelligente
SmartTrim=1
SmartTrimThreshold=80

; Instance count limiter (eviter multi-instances accidentels)
InstanceCountLimit=1

; ============================================================
; INSTALLATION :
; 1. Installer Process Lasso Pro (payant) ou version gratuite
; 2. Options > Gérer la configuration > Importer
; 3. Selectionner ce fichier .ini
; 4. Verifier: Options > ProBalance > Exclusions liste
; ============================================================