; ============================================================
; FMX Optimisation - Configuration ISLC (Intelligent Standby List Cleaner)
; ============================================================
; Timer Resolution: 0.5ms (optimal pour gaming)
; Seuil nettoyage RAM Standby selon votre configuration
; Lancement automatique au demarrage
; ============================================================

[ISLC]
; Resolution timer en millisecondes (0.5 = optimal gaming)
TimerResolution=0.5

; Demarrage automatique avec Windows
AutoStart=1

; Minimiser dans la barre des taches
MinimizeToTray=1

; Nettoyer la liste Standby automatiquement
ClearStandbyList=1

; Seuil RAM Standby en MB avant nettoyage automatique
; 16GB RAM  -> 512 MB
; 32GB RAM  -> 1024 MB (RECOMMANDE)
; 64GB RAM  -> 2048 MB
; 128GB RAM -> 4096 MB
StandbyThresholdMB=1024

; Utiliser resolution timer personnalisee
CustomTimerResolution=1

; Journaliser les evenements (0=non, 1=oui)
LogEvents=0

; Intervalle de verification en ms (1000 = 1 seconde)
CheckInterval=1000

; ============================================================
; INSTALLATION :
; 1. Telecharger ISLC: https://www.techpowerup.com/download/techpowerup-islc/
; 2. Extraire, lancer ISLC.exe en ADMINISTRATEUR
; 3. Fichier > Import Configuration > Selectionner ce fichier
; 4. Cliquer "Start" puis "Minimize to Tray"
; 5. Verifier: Timer Resolution affiche 0.5000 ms
; ============================================================