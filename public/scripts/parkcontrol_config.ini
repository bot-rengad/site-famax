; ============================================================
; FMX Optimisation - Configuration ParkControl (Bitsum)
; ============================================================
; Profil: Bitsum Highest Performance
; Core Parking: COMPLETEMENT DESACTIVE
; Frequency Scaling: DESACTIVE
; Performance Mode: 1 (Maximum)
; ============================================================

[ParkControl]
; Profil de performance actif
Profile=Bitsum Highest Performance

; Stationnement des coeurs (Core Parking) - DESACTIVE
CoreParking=Disabled

; Mise a l'echelle frequence (Frequency Scaling) - DESACTIVEE
FrequencyScaling=Disabled

; Mode performance maximum
PerformanceMode=1

; Seuils demotion/promotion coeurs - DESACTIVES
IdleDemotion=Disabled
IdlePromotion=Disabled

; Seuil activite pour considerer coeur "busy" (0 = toujours actif)
BusyThreshold=0

; Temps minimum coeur actif avant parking (ms) - MAX
MinCoreParkingTime=0

; ============================================================
; INSTALLATION :
; 1. Installer ParkControl (gratuit): https://bitsum.com/parkcontrol/
; 2. Lancer en ADMINISTRATEUR
; 3. Menu > Import Configuration > Selectionner ce fichier
; 4. Verifier: Onglet "CPU Cores" - Tous les coeurs = "Unparked"
; 5. Appliquer > OK
; ============================================================